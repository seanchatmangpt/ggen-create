name: CI Admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ci-admission-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: exact-head admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_deep: ${{ steps.admit.outputs.build_deep }}
      ci_deep: ${{ steps.admit.outputs.ci_deep }}
      docs_deep: ${{ steps.admit.outputs.docs_deep }}
      ontology_deep: ${{ steps.admit.outputs.ontology_deep }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact head and route evidence
        id: admit
        env:
          RECEIPT_PATH: ${{ runner.temp }}/ci-errc-receipt.json
        run: >-
          python3 scripts/ci_admit.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --repository "$GITHUB_REPOSITORY"
          --receipt "$RECEIPT_PATH"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload exact-head receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-errc-receipt-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/ci-errc-receipt.json
          if-no-files-found: error
          retention-days: 14

  gall-crown:
    name: GALL crown ALIVE
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute every checkpoint and crown
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/gall"
          mkdir -p "$receipt_dir"
          for checkpoint in exact_head clean_tree routing ci docs ontology build receipt; do
            python3 scripts/gall_checkpoint.py \
              --checkpoint "$checkpoint" \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --receipt "$receipt_dir/$checkpoint.json"
          done
          python3 scripts/gall_checkpoint.py \
            --checkpoint all \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$receipt_dir/crown.json"
      - name: Upload checkpoint and crown receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gall-crown-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/gall/*.json
          if-no-files-found: error
          retention-days: 14

  ci-deep:
    name: CI self evidence (path-owned)
    needs: admission
    if: ${{ needs.admission.outputs.ci_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane ci

  docs-deep:
    name: documentation evidence (path-owned)
    needs: admission
    if: ${{ needs.admission.outputs.docs_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane docs
      - name: Upload documentation Gall receipt
        if: ${{ always() && hashFiles('gall-hygen-parity-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hygen-parity-docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: gall-hygen-parity-receipt.json
          if-no-files-found: error
          retention-days: 14
  ontology-deep:
    name: ontology evidence (path-owned)
    needs: admission
    if: ${{ needs.admission.outputs.ontology_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane ontology

  build-deep:
    name: build evidence (path-owned)
    needs: admission
    if: ${{ needs.admission.outputs.build_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane build
      - name: Upload enterprise architecture receipt
        if: ${{ always() && hashFiles('enterprise-architecture-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-architecture-${{ github.event.pull_request.head.sha || github.sha }}
          path: enterprise-architecture-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build Gall receipt
        if: ${{ always() && hashFiles('gall-hygen-parity-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hygen-parity-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: gall-hygen-parity-receipt.json
          if-no-files-found: error
          retention-days: 14

  p7-crown:
    name: P7 parity crown (real ggen + real hygen)
    # Push-to-main only, not every PR: this job downloads a ggen release binary and does
    # a full npm/yarn install to drive the real, independent hygen renderer - real time
    # and network cost per run. Re-certifies HYGEN_CREATE_PARITY_ALIVE whenever main
    # actually changes, which is what GALL's exact-head requirement cares about; PR
    # feedback stays on the fast admission/gall-crown/deep-lane jobs above.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    env:
      GGEN_VERSION: "v26.8.6"
      GGEN_ASSET: "ggen-x86_64-unknown-linux-gnu.tar.gz"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "20"}
      - name: Download and verify pinned ggen release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GGEN_VERSION" -R seanchatmangpt/ggen \
            -p "$GGEN_ASSET" -p "$GGEN_ASSET.sha256" -D "$RUNNER_TEMP/ggen-dl"
          cd "$RUNNER_TEMP/ggen-dl"
          sha256sum -c "$GGEN_ASSET.sha256"
          tar -xzf "$GGEN_ASSET"
          chmod +x ggen
          echo "$RUNNER_TEMP/ggen-dl" >> "$GITHUB_PATH"
      - name: Verify ggen binary resolves
        run: ggen --version
      - name: Run the P7 parity crown
        run: >-
          python3 scripts/gall_p7_crown.py
          --root .
          --receipt "$RUNNER_TEMP/p7-crown-receipt.json"
      - name: Upload P7 crown receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-crown-${{ github.sha }}
          path: ${{ runner.temp }}/p7-crown-receipt.json
          if-no-files-found: error
          retention-days: 14
