name: CI Admission
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-admission-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    name: exact-head admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_deep: ${{ steps.admit.outputs.build_deep }}
      ci_deep: ${{ steps.admit.outputs.ci_deep }}
      docs_deep: ${{ steps.admit.outputs.docs_deep }}
      ontology_deep: ${{ steps.admit.outputs.ontology_deep }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact head and route evidence
        id: admit
        env:
          RECEIPT_PATH: ci-errc-receipt.json
        run: >-
          python3 scripts/ci_admit.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --repository "$GITHUB_REPOSITORY"
          --receipt "$RECEIPT_PATH"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload exact-head receipt
        if: ${{ always() && hashFiles('ci-errc-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-errc-receipt-${{ env.HEAD_SHA }}
          path: ci-errc-receipt.json
          if-no-files-found: error
          retention-days: 14
  ci-deep:
    name: CI self evidence
    needs: admission
    if: ${{ needs.admission.outputs.ci_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane ci
  docs-deep:
    name: documentation evidence
    needs: admission
    if: ${{ needs.admission.outputs.docs_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane docs
      - name: Upload documentation Gall receipt
        if: ${{ always() && hashFiles('gall-hygen-parity-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hygen-parity-docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: gall-hygen-parity-receipt.json
          if-no-files-found: error
          retention-days: 14
  ontology-deep:
    name: ontology evidence
    needs: admission
    if: ${{ needs.admission.outputs.ontology_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane ontology
  build-deep:
    name: build evidence
    needs: admission
    if: ${{ needs.admission.outputs.build_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - run: python3 scripts/ci_admit.py --lane build
      - name: Upload build Gall receipt
        if: ${{ always() && hashFiles('gall-hygen-parity-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hygen-parity-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: gall-hygen-parity-receipt.json
          if-no-files-found: error
          retention-days: 14
