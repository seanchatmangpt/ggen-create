name: ggen-create native protocols

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ggen-create-native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and validators
        run: |
          python -m pip install -e .
          python -m pip install rdflib
      - name: Compile and execute all tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Parse machine-readable authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph
          for path in (Path("schemas/capture.schema.json"), Path("schemas/a2a-agent-card.schema.json"), Path("schemas/native-receipt.schema.json")):
              json.loads(path.read_text())
          for path in (Path("ontology/ggen-create.ttl"), Path("ontology/native-runtime.ttl"), Path("shapes/ggen-create.shacl.ttl"), Path("shapes/native-runtime.shacl.ttl")):
              graph = Graph(); graph.parse(path, format="turtle"); assert len(graph) > 0, path
          PY
      - name: Exercise automatic, autonomic, MCP, A2A, and self-play
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-subject"
          mkdir -p "$root"
          printf 'Hello hello\n' > "$root/Hello.txt"
          cd "$root"
          ggen-create start greeter
          ggen-create add Hello.txt
          ggen-create usename Hello
          ggen-create automatic plan --output _ggen
          ggen-create automatic run --output _ggen --confirm
          ggen-create autonomic run --output _ggen --max-cycles 2 --stable-cycles 1 --apply --confirm
          ggen-create selfplay run --confirm
          ggen-create --json doctor > doctor.json
          python - <<'PY'
          from pathlib import Path
          from ggen_create.a2a import A2AService
          from ggen_create.mcp import McpServer
          root = Path.cwd()
          mcp = McpServer(root)
          init = mcp.handle({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}})
          assert init["result"]["protocolVersion"] == "2025-11-25"
          assert len(mcp.handle({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})["result"]["tools"]) >= 9
          a2a = A2AService(root, base_url="http://127.0.0.1:8765")
          assert a2a.agent_card()["supportedInterfaces"][0]["protocolVersion"] == "1.0"
          response = a2a.handle_rpc({"jsonrpc":"2.0","id":3,"method":"SendMessage","params":{"message":{"messageId":"ci","role":"ROLE_USER","parts":[{"data":{"operation":"automatic.plan","arguments":{"output_root":"_ggen"}}}]}}})
          assert response["result"]["task"]["status"]["state"] == "TASK_STATE_COMPLETED"
          PY
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggen-create-native-evidence
          path: |
            ${{ runner.temp }}/native-subject/.ggen-create/
            ${{ runner.temp }}/native-subject/doctor.json
          if-no-files-found: warn
